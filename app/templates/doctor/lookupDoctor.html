{% extends 'home_doctor.html' %}
{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename= 'css/doctor/lookupDoctor.css')}}">
<link rel="stylesheet" href="{{ url_for('static', filename= 'css/style_doctor.css')}}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
{% endblock %}
{% block middle %}
<div class="container-fluid mt-4">
    <div class="row justify-content-center">
        <div class="col-md-12">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white text-center">
                    <h5>Tra Cứu Thông Tin Thuốc và Bệnh Nhân</h5>
                </div>
                <div class="card-body">
                    <!-- Combo Box và Input Search -->
                    <div class="input-group mb-3">
                        <select class="form-select" id="searchType">
                            <option value="thuoc">Thuốc</option>
                            <option value="benhnhan">Bệnh nhân</option>
                        </select>
                        <input type="text" class="form-control" id="searchInput" placeholder="Nhập từ khóa...">
                        <button class="btn btn-primary" type="button" id="searchButton">Tìm kiếm</button>
                    </div>

                    <!-- Kết quả tìm kiếm -->
                    <div id="searchResults" class="mt-3">
                        <p class="text-muted text-center">Vui lòng nhập từ khóa để tìm kiếm...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}


{% block right %}

{% endblock %}
{% block javascript %}
<script src="{{ url_for('static', filename='js/doctor/lookupDoctor.js') }}"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/main.min.js"></script>
<script src="{{ url_for('static', filename='js/doctor.js') }}"></script>
{% endblock %}
