<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tư Vấn Khám Bệnh</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>Tư Vấn Khám Bệnh</h1>
        <form method="POST">
            <label for="symptoms">Nhập triệu chứng của bạn:</label><br>
            <textarea id="symptoms" name="symptoms" rows="4" cols="50" placeholder="Ví dụ: Tôi bị sốt và đau đầu..."></textarea><br><br>
            <button type="submit">Tư vấn</button>
        </form>
        <div class="result">
            {% if result %}
                <p>{{ result }}</p>
            {% endif %}
        </div>
    </div>
</body>
</html>
