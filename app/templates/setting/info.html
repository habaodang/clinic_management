{% extends 'setting.html' %}
{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/setting.css') }}"/>
<link rel="stylesheet" href="{{ url_for('static', filename='css/setting/info.css') }}"/>
{% endblock %}
{% block middle %}
<div class="form-container">
    <h2>Thông Tin Nhân Viên</h2>
    <form>
        <div class="form-group">
            <label for="employee-id">Căn Cước Công Dân</label>
            <input type="text" id="employee-id" name="employee-id" value="QTV012" readonly>
        </div>

        <div class="form-group">
            <label for="full-name">Họ và Tên</label>
            <input type="text" id="full-name" name="full-name" placeholder="Hà Bảo Đăng">
        </div>


        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="habaodang@gmail.com">
        </div>

        <div class="form-group">
            <label for="phone">Số Điện Thoại</label>
            <input type="text" id="phone" name="phone" placeholder="+84 0399646729">
        </div>

        <div class="form-group">
            <label for="notes">Ghi Chú</label>
            <textarea id="notes" name="notes" rows="3" placeholder=""></textarea>
        </div>

        <div class="button-container">
            <button type="submit" class="save-btn">Lưu</button>
            <button type="button" class="back-btn">Quay Lại</button>
        </div>
    </form>
</div>
{% endblock %}
{% block right %}
<div class="form-container">
    <h2>Ảnh Đại Diện</h2>
    <div class="form-group">
        <label class="upload-box" id="upload-label" for="profile-picture">Upload your photo</label>
    <input type="file" id="profile-picture" name="profile-picture" accept="image/*" style="display: none;">
    <img id="avatar-preview" src="" alt="Avatar Preview">
    <button type="button" id="change-avatar-btn" >Thay đổi ảnh</button>
    </div>
    <div class="button-container">
            <button type="submit" class="save-btn">Lưu</button>
            <button type="button" class="back-btn">Quay Lại</button>
    </div>
</div>
{% endblock %}
{% block javascript %}
<script src="{{ url_for('static', filename='js/setting.js') }}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
{% endblock %}
