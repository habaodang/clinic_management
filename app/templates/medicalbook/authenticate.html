<div class="form-container">
    <h2>Thông Tin Người Dùng</h2>
    <form>
        <div class="form-group">
            <label for="employee-id">Căn Cước Công Dân</label>
            <input type="text" id="employee-id" name="employee-id" value="QTV012" readonly>
        </div>

        <div class="form-group">
            <label for="full-name">Họ và Tên</label>
            <input type="text" id="full-name" name="full-name" placeholder="Hà Bảo Đăng">
        </div>


        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="habaodang@gmail.com">
        </div>

        <div class="form-group">
            <label for="phone">Số Điện Thoại</label>
            <input type="text" id="phone" name="phone" placeholder="+84 0399646729">
        </div>

        <div class="form-group">
            <label for="notes">Ghi Chú</label>
            <textarea id="notes" name="notes" rows="3" placeholder=""></textarea>
        </div>

        <div class="button-container">
            <button type="submit" class="save-btn">Lưu</button>
            <button type="button" class="back-btn">Quay Lại</button>
        </div>
    </form>
</div>
