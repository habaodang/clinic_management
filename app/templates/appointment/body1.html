{% extends 'appointment.html' %}
{% block form %}
<div class="col-md-7">
    <div class="card shadow-lg">
        <div class="card-body">
            <h3 class="card-title text-center mb-4 text-primary">Thông Tin Đặt Lịch Hẹn</h3>
            <form>
                <div class="row mb-3">
                    <div class="col-md-6 mb-3 mb-md-0">
                        <label for="doctor" class="form-label">Gói Khám</label>
                        <select id="doctor" class="form-select">
                            <option value="bs0">Trống</option>
                            <option value="bs1">Gói Khám Dành Cho Người Lớn</option>
                            <option value="bs2">Gói Khám Dành Cho Trẻ Em</option>
                            <option value="bs2">Gói Khám Dành Cho Sản Phụ</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="doctor" class="form-label">Chọn Khoa</label>
                        <select id="doctor" class="form-select">
                            <option value="bs1">   Trống</option>
                            <option value="bs1">   Khoa Nội</option>
                            <option value="bs2">   Khoa Mắt</option>
                            <option value="bs1">   Khoa Sản phụ</option>
                            <option value="bs2">   Khoa Nhi</option>
                            <option value="bs1">   Răng - Hàm - Mặt</option>
                            <option value="bs2">   Khoa Da Liễu</option>
                        </select>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-6 mb-3 mb-md-0">
                        <label for="clinic-room" class="form-label">Tình Trạng</label>
                        <input type="text" class="form-control" id="clinic-room" placeholder="Ghi Chú"/>
                    </div>
                    <div class="col-md-6">
                        <button type="button" id="btn-consult" class="btn btn-primary w-30 btTuvan">Tư Vấn</button>
                    </div>
                </div>
                <div class="form-check mb-3 mleft-2">
                    <input type="checkbox" class="form-check-input" id="captcha1" checked/>
                    <label class="form-check-label check-form" for="captcha">Tôi không phải là người máy</label>
                </div>
                <a href="/appointment" class="btn btn-secondary w-30 appointmentBack">Quay Lại</a>
                <button type="submit" id="btn-book" class="btn btn-primary w-30">Đặt Lịch Khám</button>
            </form>
        </div>
    </div>
</div>
<!-- Success Notification -->
<div id="success-notification" class="position-fixed top-50 start-50 translate-middle-x bg-white p-4 shadow rounded-3 appointmentFinish">
    <div class="d-flex justify-content-end">
        <button id="close-notification" class="btn-close" aria-label="Close"></button>
    </div>
    <h3 class="mb-3 ">Đặt Lịch Thành Công</h3>
    <button id="accept-notification" class="btn btn-primary">Chấp nhận</button>
</div>
{% endblock %}
{% block javascript %}
<script src="{{ url_for('static', filename='js/appointment/appointmentFinish.js') }}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
{% endblock %}
